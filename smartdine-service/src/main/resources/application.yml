server:
  port: 8080

spring:
  application:
    name: smartdine-service
  profiles:
    active: dev
  main:
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        import-check:
          enabled: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${smartdine.datasource.driver-class-name}
    url: jdbc:mysql://${smartdine.datasource.host}:${smartdine.datasource.port}/${smartdine.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${smartdine.datasource.username}
    password: ${smartdine.datasource.password}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  data:
    mongodb:
      uri: mongodb://localhost:27017/chat_memory_db
    redis:
      host: localhost
      port: 6379
      database: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartdine.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      smartdine:
        mapper: debug
        service: info
        controller: info

smartdine:
  jwt:
    admin-secret-key: itcast
    admin-ttl: 720000000
    admin-token-name: token
    user-secret-key: itheima
    user-ttl: 720000000
    user-token-name: authentication
  wechat:
    appid: ${smartdine.wechat.appid}
    secret: ${smartdine.wechat.secret}
  shop:
    address: ${smartdine.shop.address}
  baidu:
    ak: ${smartdine.baidu.ak}

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: smartdine-resource
    region: cn-beijing
